<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>D · 진단 + AI 처방</title>
<link rel="stylesheet" href="base.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script><script src="data.js"></script><script src="shared.js"></script><script src="map.js"></script>
<style>
.wrap{max-width:1400px;margin:0 auto;padding:24px 28px 60px}
.head{display:flex;align-items:flex-end;gap:20px;margin-bottom:18px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{border:0;background:none;font:inherit;font-weight:700;color:var(--muted);padding:8px 16px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--brand);color:#fff}
.seg.sm button{padding:5px 11px;font-size:12px}
.layout{display:grid;grid-template-columns:1fr 420px;gap:20px;align-items:start}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.sum .card{padding:14px 16px}.sum b{font-size:22px;font-weight:800;display:block;letter-spacing:-.02em}.sum span{font-size:12px;color:var(--muted)}
.fc{margin-bottom:10px;overflow:hidden}
.fc.recd{outline:2px solid var(--brand);outline-offset:-1px}
.fhead{padding:16px 18px;display:grid;grid-template-columns:52px 1fr 250px 20px;gap:16px;align-items:center;cursor:pointer}
.fhead:hover{background:var(--surface-2)}
.score{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px}
.fname{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}.fname small{color:var(--muted);font-weight:500;font-size:12px}
.say{font-size:13px;color:var(--ink-2);margin:3px 0 8px}
.mbars{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.mbars div{font-size:11px;color:var(--muted)}.mbars .bar{margin-top:3px;height:5px}
.fn{font-size:12px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.fn b{font-family:Consolas,monospace}
.chev{color:var(--muted);transition:transform .2s}.fc.open .chev{transform:rotate(180deg)}
.rec{font-size:11px;font-weight:800;color:#fff;background:var(--brand);padding:2px 8px;border-radius:6px}
.detail{display:none;border-top:1px solid var(--line);background:var(--surface-2);padding:18px 20px 20px 86px}
.fc.open .detail{display:grid;grid-template-columns:1.1fr 1fr;gap:22px}
.detail h5{font-size:12px;color:var(--muted);font-weight:800;letter-spacing:.04em;margin-bottom:8px}
.why{display:grid;grid-template-columns:96px 1fr 58px;gap:8px 10px;align-items:baseline;font-size:12.5px}
.why b{font-size:13px}.why .s{color:var(--ink-2)}.why .p{color:var(--muted);text-align:right;font-size:11.5px}
.ftab{width:100%;border-collapse:collapse;font-size:12.5px}.ftab td{padding:5px 0;border-bottom:1px dashed var(--line)}
.ftab td:first-child{font-family:Consolas,monospace;font-weight:700}.ftab .bar{height:5px;width:90px;display:inline-block;vertical-align:middle}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.chips .chip{font-size:11.5px;padding:2px 8px;cursor:pointer}.chips .more{display:none}.chips.all .more{display:inline-flex}.chips .toggle{background:var(--brand-soft);color:var(--brand-ink);border-color:#C9DAF8;font-weight:700}
.dacts{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end}
.btn.sm{padding:7px 12px;font-size:12.5px}
.mapcard{height:720px;position:relative;overflow:hidden}
.mapbar{position:absolute;left:16px;top:14px;right:16px;display:flex;gap:10px;align-items:center;z-index:2}
.mapbar .h2{margin-right:6px}
.zoombox{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:6px;z-index:2}
.zoombox button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:800;cursor:pointer}
.legend{position:absolute;left:16px;bottom:14px;display:flex;gap:12px;flex-wrap:wrap;background:rgba(255,255,255,.94);padding:8px 12px;border-radius:10px;border:1px solid var(--line);font-size:12px;color:var(--ink-2);z-index:2;max-width:70%}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.legend s{display:inline-block;width:16px;height:3px;border-radius:2px;margin-right:5px;vertical-align:3px;text-decoration:none}
.maptooltip{position:absolute;pointer-events:none;background:#0F1B2D;color:#fff;font-size:12px;line-height:1.6;padding:10px 12px;border-radius:10px;max-width:260px;transition:opacity .12s;z-index:3}
.maptooltip .g{margin-left:8px;font-weight:800;font-size:11px;padding:1px 6px;border-radius:5px}
.maptooltip em{color:#9CC2FF;font-style:normal}
.pick{position:absolute;right:62px;bottom:16px;width:280px;padding:14px;z-index:2}
.ai{position:sticky;top:80px;padding:20px;max-height:calc(100vh - 100px);overflow:auto}
.ai .lead{font-size:20px;font-weight:800;letter-spacing:-.01em;line-height:1.35;margin:6px 0 10px}
.cyc{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.cyc .row{display:grid;grid-template-columns:128px 1fr 32px;gap:8px;align-items:center;font-size:12px;margin:5px 0}
.cyc .bar{height:8px}
.pitem{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.pitem .n{width:26px;height:26px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
.pitem b{font-size:14px}.pitem p{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.kind{font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;margin-left:6px;vertical-align:1px}
.k-link{background:#E8F0FD;color:var(--brand-ink)}.k-in{background:#EEF6EA;color:#3F7A24}
.bubble{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface-2);margin-top:10px;font-size:13px;color:var(--ink-2)}
.bubble h4{font-size:13px;color:var(--ink);margin-bottom:4px}
.acts{display:flex;gap:8px;margin-top:16px}.acts .btn{flex:1}
.meta{font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;margin-top:10px}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:14px 0 6px}.prog span{display:block;height:100%;width:0;background:var(--brand);transition:width .2s}
.example{float:right;font-size:10.5px;background:#FFF4D6;color:#8A6100;border:1px solid #F1D48A;padding:1px 8px;border-radius:6px;font-weight:700}
</style></head><body>
<div id="top"></div>
<div class="wrap">
  <div class="head"><div><div class="eyebrow">엉킴 진단 · OpenTyrian · C 52파일</div>
    <div class="h1" style="font-size:26px">52개 파일 중 11개가 심하게 엉켜 있고,<br>43개 파일이 하나의 순환 고리로 묶여 있습니다.</div></div>
    <div class="seg" id="view" style="margin-left:auto"><button class="on" data-v="cards">진단서</button><button data-v="map">스파게티 지도</button></div></div>
  <div class="layout">
    <div>
      <div class="sum"><div class="card"><b style="color:var(--gE)">11 / 52</b><span>심하게 엉킨 파일 (E등급)</span></div>
        <div class="card"><b>43개 파일</b><span>서로 꼬리를 무는 순환 고리</span></div>
        <div class="card"><b>333개</b><span>파일 사이 연결선</span></div>
        <div class="card"><b>CC 388</b><span>가장 복잡한 함수 · JE_main</span></div></div>
      <div id="cards"></div>
      <div id="map" class="card mapcard" hidden>
        <div class="mapbar"><div class="h2">스파게티 지도</div>
          <div class="seg sm" id="lay"><button class="on" data-v="force">자유 배치</button><button data-v="circle">원형 배치</button></div>
          <div class="seg sm" id="flt"><button class="on" data-v="all">전체 연결</button><button data-v="cycle">순환 고리만</button><button data-v="plan">AI 처방 주변</button></div></div>
        <div id="mapHost" style="position:absolute;inset:0"></div>
        <div class="zoombox"><button id="zi">+</button><button id="zo">−</button><button id="zr" title="원래 크기">⤢</button></div>
        <div class="legend"><span><i style="background:var(--gE)"></i>E 심함</span><span><i style="background:var(--gD)"></i>D</span><span><i style="background:var(--gC)"></i>C</span><span><i style="background:var(--gB)"></i>B</span><span><i style="background:var(--gA)"></i>A 깔끔</span>
          <span><i style="background:#fff;border:2.5px solid var(--brand)"></i>AI 처방</span><span><s style="background:#2F6FDB"></s>이 파일이 부름</span><span><s style="background:#E8743B"></s>이 파일을 부름</span></div>
        <div class="card pick" id="pick" hidden></div>
      </div>
    </div>
    <aside class="card ai" id="ai"></aside>
  </div>
</div>
<div class="label-badge">시안 D · 진단서↔지도 + AI 처방 (AI 문구는 예시)</div>
<script>
document.getElementById('top').innerHTML = topbar(1);
let planNames = []; let planned=false, map=null;
const say = {game_menu:'아이템 화면 함수 하나가 1,475줄에 분기 378개를 품고, 전역 변수를 679번 건드립니다.',
 tyrian2:'메인 루프와 이벤트 처리가 한 파일에 몰려 분기와 전역 상태가 가장 많이 겹칩니다.',
 opentyr:'26개 파일이 이 파일을 부르고, 이 파일은 30개 파일을 부릅니다. 순환 고리의 중심입니다.',
 mainint:'플레이어 이동 함수가 1,134줄로 입력·충돌·화면 처리가 한 곳에 섞여 있습니다.',
 destruct:'미니게임 전체가 한 파일에서 전역 변수를 390번 건드립니다.',
 varz:'특수 무기 처리가 전역 상태를 많이 바꾸며 여러 파일과 서로 참조합니다.',
 keyboard:'16개 파일이 입력 처리를 직접 부르고, 입력 처리가 다시 게임 상태를 건드립니다.',
 video:'23개 파일이 화면 출력 함수를 직접 부릅니다.'};
const topPct = p => `상위 ${Math.max(2,100-p)}%`;
function whyRows(t){return [
 ['분기 복잡도', `가장 복잡한 함수 ${t.funcs[0].name}의 분기 ${t.funcs[0].cc}개`, t.pct.cc],
 ['연결된 파일', `부르는 파일 ${t.calls.length}개 · 불리는 파일 ${t.calledBy.length}개`, t.pct.coupling],
 ['순환 고리', `${DATA.cycleSize}개 파일 고리 안에서 연결 ${t.raw.dependency_cycle}개`, t.pct.dependency_cycle],
 ['전역 변수 접근', `여러 파일이 함께 쓰는 변수를 ${t.raw.global_state}번 읽고 바꿈`, t.pct.global_state],
 ['게임 루프 근접', t.raw.game_loop_centrality>0?'매 프레임 실행 흐름과 가까움':'게임 루프와 직접 닿지 않음', t.pct.game_loop_centrality]];}
function chips(list,n=8){return list.map((x,i)=>`<span class="chip ${i>=n?'more':''}" onclick="showOnMap('${x}')">${x}</span>`).join('')+(list.length>n?`<span class="chip toggle" onclick="toggleChips(this,${list.length-n})">+${list.length-n}개 더 보기</span>`:'');}
function toggleChips(el,k){const box=el.parentNode;box.classList.toggle('all');el.textContent=box.classList.contains('all')?'접기':`+${k}개 더 보기`;box.appendChild(el);}
function renderCards(){const open=[...document.querySelectorAll('.fc.open')].map(e=>e.id);
 document.getElementById('cards').innerHTML = DATA.top.map((t,i)=>{const r=planned?planNames.indexOf(t.name):-1;const maxcc=t.funcs[0].cc;return `<div class="card fc ${r>=0?'recd':''}" id="fc-${t.name}">
 <div class="fhead" onclick="this.parentNode.classList.toggle('open')"><div class="score" style="background:${GCOL[t.grade]}">${t.si.toFixed(0)}</div>
 <div><div class="fname">${i+1}. ${t.name}<small>${t.file} · ${t.loc.toLocaleString()}줄</small>${r>=0?`<span class="rec">AI 처방 ${r+1}순위</span>`:''}</div>
  <div class="say">${say[t.name]}</div>
  <div class="mbars">${Object.keys(MLAB).map(k=>`<div>${MLAB[k]}<div class="bar"><span style="width:${t.pct[k]}%;background:${t.pct[k]>=85?'var(--gE)':t.pct[k]>=60?'var(--gD)':'#9DB0CC'}"></span></div></div>`).join('')}</div></div>
 <div class="fn">가장 복잡한 함수<br><b>${t.funcs[0].name}</b> · CC ${t.funcs[0].cc} · ${t.funcs[0].loc}줄</div><span class="chev">▾</span></div>
 <div class="detail"><div><h5>왜 엉켰나요?</h5><div class="why">${whyRows(t).map(([l,s,p])=>`<b>${l}</b><span class="s">${s}</span><span class="p">${topPct(p)}</span>`).join('')}</div></div>
  <div><h5>복잡한 함수 ${t.funcs.length} / ${t.fcount}개</h5><table class="ftab">${t.funcs.map(f=>`<tr><td>${f.name}</td><td>${f.line}행</td><td>CC <b>${f.cc}</b></td><td><span class="bar"><span style="width:${f.cc/maxcc*100}%;background:${f.cc>=50?'var(--gE)':'#9DB0CC'}"></span></span></td></tr>`).join('')}</table>
   <h5 style="margin-top:14px">이 파일이 부르는 파일 ${t.calls.length}개</h5><div class="chips">${chips(t.calls)}</div>
   <h5>이 파일을 부르는 파일 ${t.calledBy.length}개</h5><div class="chips">${chips(t.calledBy)}</div></div>
  <div class="dacts"><button class="btn ghost sm" onclick="showOnMap('${t.name}')">지도에서 보기</button></div></div></div>`}).join('')
 + `<button class="btn ghost" style="width:100%">나머지 44개 파일 보기</button>`;
 open.forEach(id=>document.getElementById(id)?.classList.add('open'));}
renderCards(); document.getElementById('fc-opentyr').classList.add('open');
function setView(v){document.querySelectorAll('#view button').forEach(x=>x.classList.toggle('on',x.dataset.v===v));
  document.getElementById('map').hidden=v!=='map'; document.getElementById('cards').hidden=v==='map';
  if(v==='map'&&!map){map=SpaghettiMap(document.getElementById('mapHost'),{onPick:pick}); if(planned) map.setPlan(planNames);}}
document.querySelectorAll('#view button').forEach(b=>b.onclick=()=>setView(b.dataset.v));
function showOnMap(id){setView('map');setTimeout(()=>map.focusOn(id),60);}
function pick(d){const el=document.getElementById('pick'); if(!d){el.hidden=true;return;} el.hidden=false;
  el.innerHTML=`<div style="display:flex;align-items:center;gap:8px"><span class="grade g${d.grade}">${d.grade}</span><b style="font-size:15px">${d.id}.c</b><span style="margin-left:auto;font-weight:800">${d.si.toFixed(1)}</span></div>
  <div class="sub" style="font-size:12px;margin:6px 0 10px">부르는 파일 ${d.fout} · 불리는 파일 ${d.fin} · ${d.inCycle?'순환 고리 안':'순환 고리 밖'}</div>
  ${DATA.top.find(t=>t.name===d.id)?`<button class="btn ghost sm" style="width:100%" onclick="setView('cards');const c=document.getElementById('fc-${d.id}');c.classList.add('open');c.scrollIntoView({behavior:'smooth',block:'center'})">진단서에서 자세히 보기</button>`:''}`;}
[['lay','setLayout'],['flt','setFilter']].forEach(([id,fn])=>document.querySelectorAll('#'+id+' button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#'+id+' button').forEach(x=>x.classList.toggle('on',x===b));map[fn](b.dataset.v);}));
zi.onclick=()=>map.zoomBy(1.4); zo.onclick=()=>map.zoomBy(1/1.4); zr.onclick=()=>map.reset();
const ai=document.getElementById('ai');
function before(){ai.innerHTML=`<div class="eyebrow">AI 처방</div><div class="lead">어디부터 고치면 엉킴이 가장 많이 풀릴까요?</div>
 <p class="sub" style="font-size:13px">AI가 52개 파일의 점수·연결·순환 고리를 함께 보고, 먼저 정리할 파일을 최대 5개까지 순서대로 추천합니다. 점수가 가장 높은 파일이 아니라 여러 파일을 묶고 있는 중심 파일이 추천될 수도 있습니다.</p>
 <div class="cyc" style="margin-top:14px"><div style="font-size:12px;font-weight:700;margin-bottom:4px">AI에게 보내는 내용</div><div style="font-size:12px;color:var(--ink-2)">파일 52개의 점수·연결 관계 요약 + 주요 파일 선언부 일부 (약 60KB)</div></div>
 <div class="meta"><span>연결된 AI · Codex (내 계정)</span><a href="#" style="color:var(--brand)">변경</a></div>
 <button class="btn primary" style="width:100%;margin-top:14px" id="go">AI 처방 받기</button>`;
 document.getElementById('go').onclick=progress;}
function progress(){ai.innerHTML=`<div class="eyebrow">AI 처방</div><div class="lead">전체 구조를 살펴보고 있습니다</div>
 <div class="prog"><span id="pb"></span></div><div class="meta"><span id="pl">구조 요약 준비</span><span id="pt">0초</span></div>`;
 let s=0;const steps=['구조 요약 준비','AI가 연결 관계 검토 중','처방 정리 중'];const iv=setInterval(()=>{s++;pb.style.width=Math.min(100,s*12)+'%';pt.textContent=s+'초';pl.textContent=steps[Math.min(2,Math.floor(s/3))];if(s>8){clearInterval(iv);after();}},250);}
function cycleSizeWithout(removed){const ids=DATA.nodes.map(n=>n.id).filter(id=>!removed.has(id));const adj={};ids.forEach(i=>adj[i]=[]);
  DATA.edges.forEach(([s,d])=>{if(adj[s]&&adj[d])adj[s].push(d)});let idx=0,best=0;const ix={},low={},on={},st=[];
  function sc(v){ix[v]=low[v]=idx++;st.push(v);on[v]=1;for(const w of adj[v]){if(ix[w]===undefined){sc(w);low[v]=Math.min(low[v],low[w])}else if(on[w])low[v]=Math.min(low[v],ix[w])}
    if(low[v]===ix[v]){let n=0,w;do{w=st.pop();on[w]=0;n++}while(w!==v);if(n>1)best=Math.max(best,n)}}
  ids.forEach(v=>{if(ix[v]===undefined)sc(v)});return best;}
const EXAMPLES={
 link3:{label:'연결 중심 3개',source:'Codex',at:'10월 19일 21:30',files:[
  {name:'opentyr',kind:'link',reason:'26개 파일이 이 파일을 직접 부릅니다. 여러 파일이 함께 쓰는 설정·상태 값을 별도 파일로 옮기면, 다른 파일이 opentyr.c를 직접 부르지 않아도 됩니다.'},
  {name:'keyboard',kind:'link',reason:'입력 처리 함수가 게임 상태를 직접 바꿉니다. 입력 결과만 돌려주고 상태 변경은 부르는 쪽에 맡기면 연결이 끊어집니다.'},
  {name:'varz',kind:'link',reason:'특수 무기 처리가 여러 파일의 전역 상태를 직접 바꿉니다. 필요한 값만 주고받게 하면 고리에서 빠질 수 있습니다.'}],
  whyNotTop:'game_menu는 혼자 복잡하지만 다른 파일과의 연결은 적어서, 고치면 그 파일만 좋아집니다. opentyr는 여러 파일을 묶는 중심이라 정리했을 때 효과가 전체로 퍼집니다.',
