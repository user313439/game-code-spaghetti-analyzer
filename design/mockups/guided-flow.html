/* result page: one column, read top to bottom (as in the simple mockup) */
.s-wrap { max-width: 920px; margin: 0 auto; padding: 28px 16px 70px; }

  .s-ex { grid-template-columns: 1fr; }
  .s-ex-arrow { transform: rotate(90deg); height: 34px; }
  .s-detail { padding: 14px 16px; }
  .f-steps { grid-template-columns: 1fr; }
  .f-record-body { grid-template-columns: 1fr; }

}

        const key = `${g}: ${t}`, on = state.checked.has(key);
        return `<li><label class="${on ? "is-checked" : ""}"><input type="checkbox" data-check="${esc(key)}" ${on ? "checked" : ""}><span>${esc(t)}<small>바뀐 곳: ${esc(fn)}</small></span></label></li>`;
      }).join("")}</ul></div>`).join("");
      main = built + `<section class="card s-card"><div class="s-q">2. 직접 플레이</div><div class="s-title">바뀐 곳과 관련된 동작을 해 보세요</div>
        <p class="s-lead">AI가 변경안을 만들면서 파일마다 적은 ‘확인할 동작’을 게임 화면 순서로 묶었습니다. 해 본 것에 체크하세요. 모두 체크하지 않아도 됩니다.</p>
        <div class="f-count">${done} / ${TOTAL} 확인</div><div class="f-prog"><span style="width:${100 * done / TOTAL}%"></span></div>
        ${groups}
        <div class="f-verdict"><button class="btn primary" type="button" data-go="finish:done">정상입니다</button><button class="btn ghost" type="button" data-report="1">문제가 있었습니다</button>
          <p class="help">‘정상입니다’를 누르면 정리를 마칩니다.</p></div></section>`;
    }
  }
  const modal = v === "report" && !state.reported ? reportModal() : "";
  return `<main class="f-wrap">${head}${main}</main>${modal}`;
}

function reportModal() {
  const tags = ["화면이 이상해요", "조작이 안 돼요", "멈추거나 꺼져요", "소리가 달라요", "기타"];
  return `<div class="g-modal" role="dialog" aria-modal="true" aria-labelledby="rep-title"><div class="g-modal-box">
    <h2 id="rep-title">어떤 문제가 있었나요?</h2><p>적어 주신 내용으로 관련 코드를 찾아 드립니다.</p>
    <div class="g-field"><span>어떤 문제인가요?</span><div class="g-tags">${tags.map(t => `<button type="button" data-tag="${t}" class="${state.tag === t ? "is-on" : ""}">${t}</button>`).join("")}</div></div>
    <label class="g-field"><span>어디서 생겼나요?</span><select>${PLAY.map(([g, , , items]) => `<optgroup label="확인 목록 · ${g}">${items.map(t => `<option ${/좌우 키/.test(t) ? "selected" : ""}>${esc(t)}</option>`).join("")}</optgroup>`).join("")}
      <optgroup label="그 밖 (어느 게임이든 같은 항목)">${COMMON.map(t => `<option>${t}</option>`).join("")}</optgroup></select></label>
    <label class="g-field"><span>자세히 적어 주세요 <small>(선택)</small></span><textarea placeholder="예: 업그레이드 메뉴에서 오른쪽 키를 누르면 선택이 두 칸씩 움직여요">업그레이드 메뉴에서 오른쪽 키를 누르면 선택이 두 칸씩 움직여요.</textarea></label>
    <div class="g-field"><span>스크린샷 <small>(선택)</small></span><div class="g-shot">Ctrl+V로 붙여 넣거나 파일을 끌어 놓으세요<br><button class="btn ghost sm" type="button">이미지 고르기</button></div></div>
    <div class="g-modal-foot"><p class="help">기록은 이 작업 폴더에만 저장되고, 밖으로 보내지 않습니다.</p>
      <button class="btn ghost" type="button" data-go="finish:play">취소</button><button class="btn primary" type="button" data-submit="1">기록하기</button></div></div></div>`;
}

function renderDone() {
  return `<main class="f-wrap">
    <section class="card f-hero"><div class="big" aria-hidden="true">✓</div>
      <h1>정리를 마쳤습니다</h1><p>OpenTyrian의 동작은 그대로 두고 코드를 읽기 쉽게 나눴고, 빌드와 직접 플레이로 확인했습니다.</p>
      <div class="f-record" aria-label="정리 기록">
        <div class="f-record-head"><b>정리 기록 · OpenTyrian</b><span>10월 30일 · Claude Sonnet · 1단계(함수 나누기)</span></div>
        <div class="f-record-body">
          <div><h4>무엇이 좋아졌나</h4>
            <div class="f-num"><span>큰 함수 → 작은 함수</span><b>${targets.length}개 → ${helpers.length}개</b></div>
            <div class="f-num"><span>가장 긴 함수</span><b>${fmt(longest.before.loc)} → ${fmt(longest.after.loc)}줄</b></div>
            <div class="f-num"><span>매우 복잡한 부분</span><b>−${pct}%</b></div>
            <div class="f-num"><span>방어구 경고 기능</span><b>${fmt(armor.target.before.loc)}줄 함수 속 → ${armor.loc}줄 함수</b></div></div>
          <div><h4>어떻게 확인했나</h4><ul class="f-ok-list"><li>규칙 검사 통과</li><li>원본은 그대로, 사본에 적용</li><li>빌드 성공</li><li>직접 플레이 ${state.checked.size || TOTAL}가지 확인 · 정상</li></ul></div>
        </div></div></section>
    <section class="card s-card"><div class="s-q">이제 무엇을 할까요?</div>
      <div class="f-next">
        <button type="button" class="main"><b>수정본 내려받기</b><small>정리한 코드 전체(.zip)</small></button>
        <button type="button"><b>바뀐 코드 보기</b><small>함수마다 전후 비교</small></button>
        <button type="button"><b>정리 기록 저장</b><small>위 기록 카드를 이미지로 · 보고서·발표용</small></button>
      </div>
      <div class="s-links"><button class="btn ghost sm" type="button" data-go="result:end">단계 결과 다시 보기</button><button class="btn ghost sm" type="button">다른 게임 분석하기</button></div></section>
  </main>`;
}

// ---------------------------------------------------------------- switcher
function render() {
  document.documentElement.dataset.theme = state.theme;
  for (const b of document.querySelectorAll("#screen button")) b.classList.toggle("on", b.dataset.v === state.screen);
  document.getElementById("variant").innerHTML = VARIANTS[state.screen].map(([v, t]) => `<button type="button" data-v="${v}" class="${v === state.variant[state.screen] ? "on" : ""}">${t}</button>`).join("");
  document.getElementById("note").innerHTML = NOTES[state.screen];
  document.getElementById("root").innerHTML = state.screen === "plan" ? renderPlan() : state.screen === "result" ? renderResult() : renderFinish();
}
function go(screen, variant) {
  state.screen = screen;
  if (variant) state.variant[screen] = variant;
  if (screen === "finish" && state.variant.finish === "report") state.reported = false;
  render();
  window.scrollTo(0, 0);
}
document.getElementById("screen").addEventListener("click", e => { const b = e.target.closest("button"); if (b) go(b.dataset.v); });
document.getElementById("variant").addEventListener("click", e => { const b = e.target.closest("button"); if (b) go(state.screen, b.dataset.v); });
document.getElementById("theme").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  document.querySelectorAll("#theme button").forEach(x => x.classList.toggle("on", x === b));
  state.theme = b.dataset.v; render();
});
// Buttons in the page walk the flow.
document.getElementById("root").addEventListener("click", e => {
  const t = e.target.closest("[data-method],[data-tag],[data-report],[data-submit],[data-go]");
  if (!t) return;
  if (t.dataset.method) { state.method = t.dataset.method; render(); return; }
  if (t.dataset.tag) { state.tag = t.dataset.tag; render(); return; }
  if (t.dataset.report) { go("finish", "report"); return; }
  if (t.dataset.submit) { state.reported = true; render(); window.scrollTo(0, 0); return; }
  e.preventDefault();
  const [screen, variant] = t.dataset.go.split(":");
  if (screen !== "none") go(screen, variant);
});
document.getElementById("root").addEventListener("change", e => {
  const key = e.target.dataset.check;
  if (!key) return;
  e.target.checked ? state.checked.add(key) : state.checked.delete(key);
  const y = window.scrollY; render(); window.scrollTo(0, y);
});
render();
</script>
</body>
</html>
