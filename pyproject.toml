[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "game-si"
version = "0.1.0"
description = "Game Spaghetti Index measurement and visualization tool"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "All rights reserved" }
authors = [
    { name = "Ahn Youngjin" },
]
keywords = ["static-analysis", "game-engine", "code-quality", "spaghetti-index"]

dependencies = [
    "networkx>=3.0",        # 클래스/호출 그래프, SCC, spring_layout (W3+)
    "numpy>=1.24",          # networkx.spring_layout 의 런타임 의존
    "tree-sitter>=0.23",    # C/C++ AST 파서 (W9+)
    "tree-sitter-c>=0.23",
    "tree-sitter-cpp>=0.23",
    "lizard>=1.17",         # 외부 비교 도구 (Phase B, W13)
    "anthropic>=0.50",      # LLM Refactoring Advisor (Phase C, W13)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
game-si = "game_si.cli:main"

[tool.setuptools.packages.find]
include = ["game_si*"]
exclude = ["tests*", "benchmarks*", "reports*", "dashboard*", "csharp-analyzer*"]
